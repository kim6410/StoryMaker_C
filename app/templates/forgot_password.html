{% extends "auth_base.html" %}
{% block title %}비밀번호 찾기 - {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-sub">가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</div>
<div class="field">
  <label>이메일</label>
  <input type="email" placeholder="example@company.com">
</div>
<button class="btn" data-toast-msg="입력한 정보와 일치하는 계정이 있으면 재설정 메일을 발송했습니다. (샘플)">재설정 메일 받기</button>
<div class="auth-switch"><a class="btn ghost" href="/login">로그인으로 돌아가기</a></div>
{% endblock %}
