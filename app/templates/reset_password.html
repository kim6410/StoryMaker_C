{% extends "auth_base.html" %}
{% block title %}새 비밀번호 설정 - {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-sub">새로 사용할 비밀번호를 입력해 주세요.</div>
{% if error %}
<div class="card" style="border-color:var(--danger);color:var(--danger);font-size:13px;margin-bottom:14px">{{ error }}</div>
{% endif %}
{% if not token %}
<div class="card" style="border-color:var(--danger);color:var(--danger);font-size:13px">재설정 링크가 올바르지 않습니다. 비밀번호 찾기를 다시 시도해 주세요.</div>
<div class="auth-switch"><a class="btn ghost" href="/forgot-password">비밀번호 찾기로 돌아가기</a></div>
{% else %}
<form method="post" action="/auth/reset-password">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field">
    <label>새 비밀번호</label>
    <input type="password" name="new_password" placeholder="8자 이상" minlength="8" required>
  </div>
  <button class="btn" type="submit">비밀번호 재설정</button>
</form>
{% endif %}
{% endblock %}
